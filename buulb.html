<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bulb</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        h1{
            color: #fff;
            top: 60px;
            position: relative;
            margin-left: 140px;
            font-size: 3rem;
            font-style: oblique;
        }
        body{
            background-color: #1f1f1f;
        }
        .container{
            position: absolute;
            top: 30%;
            margin-left: 700px;
        }
        .container .wire{
            display: flex;
            align-items: center;
            justify-content: center;

        }
        .container .wire .wire1{
            width: 5px;
            height: 50px;
            background-color: blue;
            top: 10px;
            position: relative;
        }
        .container .wire .wire2{
            width: 5px;
            height: 50px;
            background-color: red;
            top: 10px;
            position: relative;
        }
        .container .holder{
            width: 80px;
            padding-top: 10px;
            height: 70px;
            background-color: #faf9f8;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            top: 11px;
            position: relative;
            margin-left: 110px;
        }
        .holder .line{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 4px;
            background-color: #252725;
            margin-bottom: 10px;
            border-radius: 10px;
        }
        .container .bulb{
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            top: 3px;
        }
        .glow{
             background-color: yellow;        
           box-shadow: 0px 14px 190px 57px yellow;
        }
        .border{
            border: 2px solid;
        }
        .bg{
            background-color: #faf9f8;
        }
        button{
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            top: 27%;
            padding: 8px;
            border-radius: 30px;
            border: none;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
             margin-left: 800px;
            transition: background-color 3s ease;
        }


    </style>
</head>
<body>
    <hr>
    <h1>BULB ONE</h1>
    
    <div class="container">
        <div class="wire">
            <div class="wire1"></div>
            <div class="wire2"></div>
        </div>
        <div class="holder">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
        <div class="bulb bg border"></div>
    </div>
    <button>ON/OFF</button>



    <H2>BULB TWO</H2>
    <div id="main">
        <div class="line"></div>
    </div>
   
    <script>
        const bulb=document.querySelector('.bulb');
        const btn=document.querySelector('button');

        btn.addEventListener('click',()=>{
            bulb.classList.toggle('glow')
            bulb.classList.toggle('border')
            bulb.classList.toggle('bg')
        })

    </script>
</body>
</html>
