<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>increment/decrement</title>
</head>
<style>
    *{
        margin: 0px;
        padding: 0px;
        background-color: rgb(0, 60, 255);
    }
    .container{
        margin-top: 10vh;
        text-align: center;
        line-height: 90px;
    }
    
    h1{
        font-size: 3rem;
    }
    h2{
        font-size: 3rem;
    }
    .button{
        font-size: 2rem;
        margin-left: 84vh;
        padding: 13px;
        width: 400px;
        display: block;
        border: none;
        border-radius: 5px;
        box-shadow: 0px 5px 5px 5px black;
        font-weight: 700;
    }
    .button:hover{
        border: 2px solid white;
       cursor: pointer;
       color: #fff;
    }
    #b1{
        background-color: rgb(3, 190, 3);
        margin-bottom: 35px;
    }
    .text{
         margin-top: 35px;
        background-color: red;
         margin-bottom: 35px;
    }
    p{
        font-size: 2rem;
    }

</style>
<body>
    <div class="container">
    <h1>Peoplem Enter</h1>
    <h2 id="number" type="number">0</h2>
    
    <button  type="button" id="b1" onclick="increment()" class="button">Increment</button>
    <button type="button" id="b2" onclick="decrement()" class="button">Decrement</button>
    <button type="button" onclick="save()"  class="button text">Save</button>
    <p id="save" >Previous Entries:</p>
    </div>
     

    <script>
        let count=0;
        function increment(){
            count +=1;
            document.getElementById('number').innerHTML = count;
        }
        function decrement(){
            count -=1;
            if(count<0){
                count=0;
            }
            document.getElementById('number').innerHTML = count;
        }
        function save(){
            if(count>0){
                
            }
            document.getElementById('save').innerHTML += ""+count+",";

        }
    </script>
</body>
</html>
